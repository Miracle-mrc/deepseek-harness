name: Fork preview build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Resolved source commit; empty uses the triggering commit.
        type: string
        required: false
        default: ''
      source_tag:
        description: Immutable fork candidate tag; empty for PR packaging smokes.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  metadata:
    if: github.repository == 'Miracle-mrc/deepseek-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      product-version: ${{ steps.source.outputs.product-version }}
      wheel-version: ${{ steps.source.outputs.wheel-version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
      - name: Resolve checked build metadata
        id: source
        env:
          FORK_PREVIEW_EXPECTED_COMMIT: ${{ inputs.source_ref || github.sha }}
          FORK_PREVIEW_SOURCE_TAG: ${{ inputs.source_tag }}
        run: python scripts/fork-preview-release.py metadata

  desktop:
    name: Unsigned Desktop / ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            command: package:desktop:win:x64:unsigned
            runner: windows-2025
            shell: pwsh
          - target: mac-arm64
            command: package:desktop:mac:arm64:unsigned
            runner: macos-latest
            shell: bash
          - target: mac-x64
            command: package:desktop:mac:x64:unsigned
            runner: macos-15-intel
            shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
      - name: Enable Windows Developer Mode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify unsigned preview installer
        run: pnpm run ${{ matrix.command }} --fork-preview
      - name: Select the verified installer
        run: python scripts/fork-preview-release.py collect-desktop --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-desktop-${{ matrix.target }}
          path: dist-fork-desktop/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-packaging-logs-${{ matrix.target }}
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  python:
    name: Native Python wheels
    needs: metadata
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      source_ref: ${{ needs.metadata.outputs.commit }}
      targets: node24-linux-x64,node24-linux-arm64,node24-macos-arm64,node24-macos-x64,node24-win-x64
      release: true
      ci: false

  python-compat:
    name: Python ${{ matrix.python }} / installed preview SDK
    needs: [metadata, python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: deepseek_harness_*
          path: dist
          merge-multiple: true
      - name: Install only candidate wheels and run the public SDK entry
        env:
          VERSION: ${{ needs.metadata.outputs.wheel-version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/preview-sdk"
          "$RUNNER_TEMP/preview-sdk/bin/python" -m pip download --only-binary=:all: 'pydantic>=2.12,<3' --dest "$RUNNER_TEMP/preview-wheel-deps"
          "$RUNNER_TEMP/preview-sdk/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/preview-wheel-deps" \
            "dist/deepseek_harness_sdk-$VERSION-py3-none-any.whl" \
            "dist/deepseek_harness_runtime_bin-$VERSION-py3-none-manylinux_2_28_x86_64.whl"
          mkdir "$RUNNER_TEMP/preview-sdk-smoke"
          cd "$RUNNER_TEMP/preview-sdk-smoke"
          env -u PYTHONPATH -u DSH_RUNTIME_MODE "$RUNNER_TEMP/preview-sdk/bin/python" "$GITHUB_WORKSPACE/scripts/smoke-python-runtime.py" --scenario sdk-default --installed-wheel
          env -u PYTHONPATH -u DSH_RUNTIME_MODE "$RUNNER_TEMP/preview-sdk/bin/python" "$GITHUB_WORKSPACE/scripts/smoke-python-runtime.py" --scenario sdk-mcp --installed-wheel

  bundle:
    name: Validate fork preview bundle
    needs: [metadata, desktop, python, python-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: fork-desktop-*
          path: preview-input
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: deepseek_harness_*
          path: preview-input
          merge-multiple: true
      - name: Check wheel metadata for all six wheels
        run: |
          python -m pip install twine==6.2.0
          python -m twine check preview-input/*.whl
      - name: Check exact assets and record candidate identity and SHA256
        env:
          FORK_PREVIEW_PRODUCT_VERSION: ${{ needs.metadata.outputs.product-version }}
          FORK_PREVIEW_COMMIT: ${{ needs.metadata.outputs.commit }}
          FORK_PREVIEW_SOURCE_TAG: ${{ inputs.source_tag }}
        run: python scripts/fork-preview-release.py bundle --input-dir preview-input --output-dir dist-fork-preview
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fork-preview-bundle
          path: dist-fork-preview/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verdict:
    name: fork preview checks passed
    if: ${{ !cancelled() }}
    needs: [metadata, desktop, python, python-compat, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any preview build or validation did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
