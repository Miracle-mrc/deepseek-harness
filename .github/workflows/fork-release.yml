name: Fork draft release

# Operator reference: .github/fork-release/README.md

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable fork-v<productVersion>-miracle.<N> tag reachable from master.
        type: string
        required: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: fork-draft-release
  cancel-in-progress: false

jobs:
  source:
    name: Validate fork release source
    if: github.repository == 'Miracle-mrc/deepseek-harness' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag-object: ${{ steps.source.outputs.tag-object }}
      product-version: ${{ steps.source.outputs.product-version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
      - name: Refresh current master
        run: git fetch --no-tags origin master:refs/remotes/origin/master
      - name: Require an unchanged candidate on successful master source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_PREVIEW_SOURCE_TAG: ${{ inputs.source_tag }}
        run: python scripts/fork-preview-release.py source

  build:
    name: Build checked fork candidate
    needs: source
    uses: ./.github/workflows/fork-preview-build.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}
      source_tag: ${{ inputs.source_tag }}

  publish:
    name: Create fork draft prerelease
    if: github.repository == 'Miracle-mrc/deepseek-harness' && github.ref == 'refs/heads/master'
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: fork-preview-bundle
          path: dist-fork-preview
      - name: Refresh current master
        run: git fetch --no-tags origin master:refs/remotes/origin/master
      - name: Recheck source identity and successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_PREVIEW_SOURCE_TAG: ${{ inputs.source_tag }}
          FORK_PREVIEW_EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
          FORK_PREVIEW_EXPECTED_TAG_OBJECT: ${{ needs.source.outputs.tag-object }}
        run: python scripts/fork-preview-release.py source
      - name: Recheck exact release assets and SHA256
        env:
          FORK_PREVIEW_SOURCE_TAG: ${{ inputs.source_tag }}
          FORK_PREVIEW_COMMIT: ${{ needs.source.outputs.commit }}
          FORK_PREVIEW_PRODUCT_VERSION: ${{ needs.source.outputs.product-version }}
        run: python scripts/fork-preview-release.py verify-bundle --input-dir dist-fork-preview
      - name: Create draft prerelease in the fork
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          gh release create "$SOURCE_TAG" dist-fork-preview/* \
            --repo Miracle-mrc/deepseek-harness \
            --verify-tag --target "$SOURCE_COMMIT" --draft --prerelease \
            --title "$SOURCE_TAG" \
            --notes 'Unsigned fork preview. Product and Python versions remain canonical; manifest.json identifies this candidate and SHA256SUMS verifies its files. Windows SmartScreen and macOS Gatekeeper warnings are expected. Review the draft before publishing.'
