# Complete cloud-command application; no Agent, model, HTTP server or Session log.
- insert:
    - id: cloud-cli
      name: '@deepseek-ai/dsh-experimental-cloud-connectors-cli'

    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: cloud-connectors
      name: '@deepseek-ai/dsh-experimental-cloud-connectors'
      config:
        restoreOnStart: false
